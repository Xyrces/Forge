name: ci

on:
  push:
    branches: [main, codex/forge-first-k3s]
  pull_request:
    branches: [main, codex/forge-first-k3s]

# Cancel superseded PR runs to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # GITHUB_TOKEN authenticates the github-xyrces NuGet source
  # (Talaria packages) during restore.
  packages: read

jobs:
  build:
    name: build + test + e2e harness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        # nuget.config's github-xyrces source expands these env vars
        # for its credentials. The Talaria packages are PRIVATE and
        # linked to the Talaria repo, so the workflow's GITHUB_TOKEN
        # gets 403 there — PACKAGES_PAT (read:packages) is the
        # cross-repo read credential.
        env:
          GITHUB_PACKAGES_USER: ${{ github.actor }}
          GITHUB_PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
        run: dotnet restore Forge.sln

      # The .sln includes the e2e-harness project, so this builds
      # the orchestrator + tests + harness all at once.
      - name: Build
        run: dotnet build Forge.sln --no-restore --configuration Release

      - name: Test
        # Ordinary PR validation never invokes paid provider/media tests.
        run: dotnet test Forge.sln --no-build --configuration Release --logger "console;verbosity=normal" --filter 'FullyQualifiedName!~RealLlmIntegrationTests&FullyQualifiedName!~MafAgentRunnerLiveTests&FullyQualifiedName!~MeshyLiveSmokeTests'

      - name: Test release and installer protocol
        run: python3 -m unittest discover -s tests/deployment -v

      - name: Test repository privacy rules
        run: python3 -m unittest discover -s tests/privacy -v

      - name: Run e2e harness
        # The harness spins up a fresh local repo, runs the
        # orchestrator's engineering dispatch workflow end-to-end
        # against the fake LocalGitHubService, and asserts the PR
        # was opened with the right diff. Requires git (preinstalled
        # on ubuntu-latest).
        run: dotnet run --project tools/e2e-harness --no-build --configuration Release -- --repo-root=$(pwd)

      - name: Benchmark runner checks
        run: python3 -m unittest discover -s tools/benchmark -v

      - name: Mixed-policy failure-path checks (no provider calls)
        run: dotnet tools/e2e-harness/bin/Release/net10.0/ph-e2e-harness.dll --benchmark-self-test-policies

      - name: External repository benchmark checks (no provider calls)
        run: dotnet tools/e2e-harness/bin/Release/net10.0/ph-e2e-harness.dll --benchmark-self-test-external

      - name: No-cost engineering benchmark
        run: python3 tools/benchmark/run.py --mode fake --no-build

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-benchmark
          path: |
            .portHorizon/benchmarks/**/report.md
            .portHorizon/benchmarks/**/results.json
            .portHorizon/benchmarks/**/result.json
            .portHorizon/benchmarks/**/run.log
            .portHorizon/benchmarks/**/grader-self-test.log
          include-hidden-files: true
          if-no-files-found: ignore
