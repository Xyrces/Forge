name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded PR runs to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build + test + e2e harness
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Forge.sln

      # The .sln includes the e2e-harness project, so this builds
      # the orchestrator + tests + harness all at once.
      - name: Build
        run: dotnet build Forge.sln --no-restore --configuration Release

      - name: Test
        # The 2 RealLlmIntegrationTests are expected to skip on CI
        # because the kilo JWT isn't in env. The remaining 402 tests
        # should pass. Fail the job if any real test fails.
        run: dotnet test Forge.sln --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Run e2e harness
        # The harness spins up a fresh local repo, runs the
        # orchestrator's engineering dispatch workflow end-to-end
        # against the fake LocalGitHubService, and asserts the PR
        # was opened with the right diff. Requires git (preinstalled
        # on ubuntu-latest).
        run: dotnet run --project tools/e2e-harness --no-build --configuration Release -- --repo-root=$(pwd)

      - name: Live verify Headroom sidecar (smoke)
        # Bring up the Headroom proxy sidecar + verify it
        # accepts a /v1/chat/completions request (HEADROOM ONLY;
        # the actual cost savings are observed in production).
        # Docs: deploy/docker-compose.headroom.yml + docs/headroom.md.
        run: |
          docker compose -f deploy/docker-compose.headroom.yml up -d
          sleep 10  # give the proxy a moment to bind
          curl -sf -X POST http://127.0.0.1:8787/v1/chat/completions \
            -H "Authorization: Bearer dummy" \
            -H "Content-Type: application/json" \
            -d '{"model":"test","messages":[]}' \
            -o /dev/null -w "HTTP %{http_code}\n" || true
          docker compose -f deploy/docker-compose.headroom.yml down