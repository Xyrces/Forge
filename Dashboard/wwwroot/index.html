<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PortHorizon.Agents dashboard</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c2129;
    --border: #30363d;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  header { padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .pill { padding: 2px 8px; border-radius: 10px; background: var(--border); color: var(--muted); font-size: 11px; }
  header .pill.live { background: var(--green); color: #000; }
  nav { padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; gap: 4px; }
  nav button { background: transparent; color: var(--muted); border: 0; padding: 10px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--fg); border-bottom-color: var(--accent); }
  nav button:hover { color: var(--fg); }
  main { padding: 16px; }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
  section > h2 { margin: 0; padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  section > h2 .actions { margin-left: auto; }
  section > h2 button { background: var(--accent); color: #000; border: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  section > h2 button.secondary { background: var(--border); color: var(--fg); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
  th { font-weight: 600; color: var(--muted); background: rgba(255,255,255,0.02); position: sticky; top: 0; }
  td.id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--accent); cursor: pointer; }
  td.diag-cell { white-space: normal; max-width: 480px; min-width: 240px; }
  .err-cell { display: block; color: var(--red); font-weight: 600; max-width: 460px; overflow: hidden; text-overflow: ellipsis; }
  .resp-cell { display: block; color: var(--muted); font-style: italic; font-size: 11px; max-width: 460px; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .status { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; display: inline-block; }
  .status.pending { background: rgba(139, 148, 158, 0.15); color: var(--muted); }
  .status.inprogress { background: rgba(88, 166, 255, 0.15); color: var(--blue, #58a6ff); }
  .status.completed { background: rgba(63, 185, 80, 0.15); color: var(--green); }
  .status.failed { background: rgba(248, 81, 73, 0.15); color: var(--red); }
  .status.blocked { background: rgba(210, 153, 34, 0.15); color: var(--yellow); }
  .status.archived { background: rgba(139, 148, 158, 0.15); color: var(--muted); }
  .counts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; padding: 12px 14px; }
  .count { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 8px 12px; }
  .count .n { font-size: 20px; font-weight: 600; }
  .count .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .events { height: 280px; overflow-y: auto; padding: 8px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .ev { padding: 3px 0; border-bottom: 1px dotted var(--border); display: grid; grid-template-columns: 90px 140px 1fr; gap: 8px; }
  .ev .t { color: var(--muted); }
  .ev .k { font-weight: 600; }
  .ev.task-transition .k { color: var(--accent); }
  .ev.acp-session-completed .k, .ev.pr-merged .k { color: var(--green); }
  .ev.acp-session-failed .k, .ev.pr-failed .k { color: var(--red); }
  .ev.pr-changes-requested .k { color: var(--yellow); }
  .ev.pr-opened .k { color: var(--purple); }
  .ev .d { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
  .empty { color: var(--muted); padding: 12px 14px; font-style: italic; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 20px; min-width: 400px; max-width: 600px; }
  .modal h3 { margin: 0 0 12px; font-size: 14px; }
  .modal label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 4px; }
  .modal input, .modal textarea, .modal select { background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 6px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; width: 100%; box-sizing: border-box; }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal button { background: var(--accent); color: #000; border: 0; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .modal button.secondary { background: var(--border); color: var(--fg); }
  .tag { display: inline-block; padding: 1px 6px; border-radius: 3px; background: var(--border); color: var(--muted); font-size: 10px; margin-right: 4px; }
  .tag.active { background: var(--green); color: #000; }
  footer { padding: 6px 16px; color: var(--muted); font-size: 11px; text-align: right; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tab { display: none; }
  .tab.active { display: block; }
  .toolbar { padding: 10px 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); align-items: center; }
  .toolbar input, .toolbar select { background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .toolbar input { flex: 1; max-width: 360px; }
  .toolbar button { background: var(--accent); color: #000; border: 0; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .toolbar button.secondary { background: var(--border); color: var(--fg); }
  .sprint-goal { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .sprint-goal h3 { margin: 0 0 4px; font-size: 13px; }
  .sprint-goal .goal { color: var(--muted); margin-bottom: 4px; font-style: italic; }
  .progress { height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .progress .bar { height: 100%; background: var(--accent); }
  .intake-grid { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 200px); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .intake-sidebar { background: var(--bg); border-right: 1px solid var(--border); overflow-y: auto; }
  .intake-sidebar .actions { padding: 8px; border-bottom: 1px solid var(--border); }
  .intake-session-list { list-style: none; padding: 0; margin: 0; }
  .intake-session-list li { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .intake-session-list li:hover { background: var(--panel); }
  .intake-session-list li.active { background: var(--accent); color: #000; }
  .intake-session-list li.active .meta { color: rgba(0,0,0,0.7); }
  .intake-session-list .title { font-weight: 600; font-size: 12px; }
  .intake-session-list .meta { color: var(--muted); font-size: 10px; margin-top: 2px; }
  .intake-thread { display: flex; flex-direction: column; height: 100%; background: var(--panel); }
  .intake-messages { flex: 1; overflow-y: auto; padding: 12px; }
  .intake-msg { margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; }
  .intake-msg .role { font-size: 10px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; letter-spacing: 0.5px; }
  .intake-msg .content { white-space: pre-wrap; }
  .intake-msg.role-user { background: var(--bg); border: 1px solid var(--border); }
  .intake-msg.role-assistant { background: rgba(80, 200, 120, 0.08); border: 1px solid rgba(80, 200, 120, 0.3); }
  .intake-msg.role-system { background: rgba(200, 200, 200, 0.06); border: 1px solid var(--border); font-style: italic; font-size: 12px; }
  .epic-proposal { margin-top: 8px; padding: 6px 10px; background: rgba(80, 160, 240, 0.12); border: 1px solid rgba(80, 160, 240, 0.4); border-radius: 4px; font-size: 12px; display: flex; align-items: center; gap: 8px; }
  .epic-proposal button { margin-left: auto; }
  .intake-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
  .intake-input input { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; font-family: inherit; font-size: 13px; }
  .intake-input button { background: var(--accent); color: #000; border: 0; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  .intake-input button:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Phase 2b.3: three-column intake grid (sidebar + chat + side-panel). */
  .intake-grid-3 { display: grid; grid-template-columns: 220px 1fr 1fr; height: calc(100vh - 200px); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .intake-panel { display: flex; flex-direction: column; height: 100%; background: var(--panel); border-left: 1px solid var(--border); overflow: hidden; }
  .intake-panel-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--bg); }
  .intake-panel-tabs button { flex: 1; background: transparent; color: var(--muted); border: 0; padding: 8px; cursor: pointer; font-family: inherit; font-size: 12px; border-bottom: 2px solid transparent; }
  .intake-panel-tabs button.active { color: var(--fg); border-bottom-color: var(--accent); background: var(--panel); }
  .intake-panel-body { flex: 1; overflow-y: auto; padding: 12px; }
  .spec-card { background: var(--bg); border: 1px solid var(--border); padding: 10px; border-radius: 4px; margin-bottom: 14px; }
  .spec-card h4 { margin: 0 0 6px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .spec-card h5 { margin: 10px 0 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .spec-card .version-tag { font-size: 10px; padding: 1px 5px; border-radius: 3px; background: rgba(200,200,200,0.15); color: var(--muted); }
  .spec-body { background: var(--panel); border: 1px solid var(--border); padding: 8px; border-radius: 4px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; line-height: 1.4; white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
  .spec-diagrams pre.mermaid { background: var(--panel); border: 1px solid var(--border); padding: 12px; border-radius: 4px; margin: 8px 0; }
  .graph-toolbar { display: flex; gap: 6px; margin-bottom: 10px; }
  .graph-toolbar input { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px; font-family: inherit; font-size: 11px; }
  .graph-toolbar button { background: var(--accent); color: #000; border: 0; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .graph-meta { color: var(--muted); font-size: 10px; margin-bottom: 8px; }
  .graph-meta code { background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .touches-list { margin-top: 14px; }
  .touches-list h5 { margin: 0 0 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .touches-list ul { list-style: none; padding: 0; margin: 0; }
  .touches-list li { padding: 4px 0; font-size: 11px; border-bottom: 1px dotted var(--border); }
  .touches-list code { background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 10px; }
  .deps-list h5 { margin: 0 0 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .deps-list .deps-ul { list-style: none; padding: 0; margin: 0; }
  .deps-list .deps-ul li { padding: 6px 0; font-size: 11px; border-bottom: 1px dotted var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .deps-list .kind-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: rgba(80, 160, 240, 0.2); color: rgb(80, 160, 240); font-weight: 600; }
  .deps-list .kind-blocks { background: rgba(220, 80, 80, 0.2); color: rgb(220, 80, 80); }
  .deps-list .kind-depends_on { background: rgba(220, 160, 80, 0.2); color: rgb(220, 160, 80); }
  .deps-list .kind-related { background: rgba(160, 160, 160, 0.2); color: var(--muted); }
  .deps-list .dep-rationale { color: var(--muted); font-style: italic; }
  pre.mermaid-error { background: rgba(220, 80, 80, 0.1); border: 1px solid rgba(220, 80, 80, 0.4); color: rgb(220, 80, 80); padding: 8px; border-radius: 4px; font-size: 11px; }
  .specs-grid { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 200px); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .specs-sidebar { background: var(--bg); border-right: 1px solid var(--border); overflow-y: auto; }
  .specs-sidebar .toolbar { padding: 8px; border-bottom: 1px solid var(--border); display: flex; gap: 6px; }
  .specs-sidebar .toolbar input, .specs-sidebar .toolbar select { flex: 1; background: var(--bg); color: var(--fg); border: 1px solid var(--border); padding: 5px 8px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .specs-list { list-style: none; padding: 0; margin: 0; }
  .specs-list li { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .specs-list li:hover { background: var(--panel); }
  .specs-list li.active { background: var(--accent); color: #000; }
  .specs-list li.active .meta { color: rgba(0,0,0,0.7); }
  .specs-list .title { font-weight: 600; font-size: 12px; }
  .specs-list .meta { color: var(--muted); font-size: 10px; margin-top: 4px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .status-tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
  .status-tag.status-draft { background: rgba(200, 200, 200, 0.15); color: var(--muted); }
  .status-tag.status-approved { background: rgba(80, 200, 120, 0.2); color: rgb(80, 200, 120); }
  .status-tag.status-superseded { background: rgba(200, 160, 80, 0.2); color: rgb(200, 160, 80); }
  .status-tag.status-archived { background: rgba(200, 200, 200, 0.08); color: var(--muted); text-decoration: line-through; }
  .specs-detail { padding: 16px; overflow-y: auto; }
  .spec-head h2 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 8px; align-items: center; }
  .spec-meta { color: var(--muted); font-size: 11px; margin-bottom: 16px; }
  .spec-body, .version-body { background: var(--bg); border: 1px solid var(--border); padding: 12px; border-radius: 4px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-x: auto; max-height: 360px; overflow-y: auto; }
  .spec-version { margin-bottom: 14px; }
  .version-head { font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
  .spec-actions { display: flex; gap: 10px; align-items: center; margin: 8px 0 16px; }
  .spec-actions .muted { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>PortHorizon.Agents</h1>
  <span class="pill live" id="conn">● live</span>
  <span class="pill" id="active-sprint"></span>
  <span style="flex:1"></span>
  <a class="pill" href="/api/state" target="_blank">/api/state</a>
</header>
<nav id="tabs">
  <button data-tab="tasks" class="active">Tasks</button>
  <button data-tab="backlog">Backlog</button>
  <button data-tab="intake">Intake</button>
  <button data-tab="specs">Specs</button>
  <button data-tab="vision">Vision</button>
  <button data-tab="design">Design</button>
  <button data-tab="sprints">Sprints</button>
  <button data-tab="agents">Agents</button>
  <button data-tab="skills">Skills</button>
</nav>
<main>
  <div class="tab active" id="tab-tasks"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-backlog"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-intake"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-specs"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-vision"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-design"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-sprints"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-agents"><div class="empty">Loading…</div></div>
  <div class="tab" id="tab-skills"><div class="empty">Loading…</div></div>
</main>
<div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const escapeHtml = (s) => (s ?? "").replace(/[<>&'"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s, n) => s.length > n ? s.slice(0, n) + "..." : s;

let state = { tasks: [], agents: [], skills: [], sprints: [], activeSprintId: null };

async function loadState() {
  try {
    const r = await fetch("/api/state");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const s = await r.json();
    state.tasks = s.tasks || [];
    state.agents = s.agents || [];
    state.skills = s.skills || [];
    state.sprints = s.sprints || [];
    state.activeSprintId = s.activeSprintId || null;
    state.completedTasks = s.completedTasks || 0;
    state.failedTasks = s.failedTasks || 0;
    $("active-sprint").textContent = s.activeSprintId ? "sprint: " + s.activeSprintId : "no active sprint";
    $("conn").className = "pill live";
    $("conn").textContent = "● live";
    refreshState();
  } catch (e) {
    $("conn").className = "pill";
    $("conn").textContent = "OFFLINE (" + (e.message || e) + ")";
    console.error("loadState failed", e);
  }
}

async function refreshState() {
  await renderAgents();
  await renderSprints();
  await renderSkills();
  await renderIntake();
  await renderSpecs();
  await renderVision();
  renderTasks();
  renderBacklog();
  $("foot").textContent = "tasks: " + state.tasks.length + " agents: " + state.agents.length + " skills: " + state.skills.length + " sprints: " + state.sprints.length;
}

function renderTasks() {
  const counts = { Pending: 0, InProgress: 0, Completed: 0, Failed: 0, Blocked: 0 };
  state.tasks.forEach(t => counts[t.status] = (counts[t.status] || 0) + 1);
  const rows = state.tasks.map(t => {
    const role = (t.parameters && t.parameters.roleAgent) || "";
    const pr = (t.parameters && t.parameters.prNumber) || "";
    const updated = t.updatedAt ? new Date(t.updatedAt).toLocaleTimeString() : "";
    const err = escapeHtml(t.error);
    const resp = escapeHtml(t.parameters && t.parameters.modelResponse);
    const fullErr = escapeHtml(t.error || "");
    const fullResp = escapeHtml(t.parameters && t.parameters.modelResponse || "");
    const errShort = trunc(err, 80);
    const respShort = trunc(resp, 80);
    const errCell = err ? `<span class="err-cell" title="${fullErr}">${errShort}</span>` : "";
    const respCell = (resp && (!err || resp !== err)) ? `<div class="resp-cell" title="${fullResp}">↳ ${respShort}</div>` : "";
    return `<tr>
      <td class="id" onclick="showIssue('${t.id}')">${t.id}</td>
      <td>${t.type}</td>
      <td><span class="status ${t.status.toLowerCase()}">${t.status}</span></td>
      <td><code>${t.branch || ""}</code></td>
      <td>${role}</td>
      <td>${pr ? "#" + pr : ""}</td>
      <td>${updated}</td>
      <td class="diag-cell">${errCell}${respCell}</td>
    </tr>`;
  }).join("");
  $("tab-tasks").innerHTML = `
    <section>
      <h2>Tasks
        <span class="actions">
          <button class="secondary" onclick="refreshState()">Refresh</button>
          <button onclick="openNewTask()">+ New issue</button>
        </span>
      </h2>
      <div class="counts">
        ${["Pending","InProgress","Completed","Failed","Blocked"].map(s => `<div class="count"><div class="n">${counts[s]||0}</div><div class="label">${s}</div></div>`).join("")}
      </div>
      <div style="max-height: 60vh; overflow-y: auto;">
        <table>
          <thead><tr><th>ID</th><th>Type</th><th>Status</th><th>Branch</th><th>Role</th><th>PR</th><th>Updated</th><th>Error</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="8" class="empty">No tasks yet.</td></tr>'}</tbody>
        </table>
      </div>
    </section>
    <section><h2>Live events</h2><div class="events" id="events"></div></section>
  `;
}

function renderBacklog() {
  $("tab-backlog").innerHTML = `
    <section>
      <h2>Backlog
        <span class="actions">
          <button class="secondary" onclick="refreshState()">Refresh</button>
          <button onclick="openNewTask()">+ New issue</button>
        </span>
      </h2>
      <div class="toolbar">
        <input id="backlog-filter" placeholder="filter id / type / title" oninput="filterBacklog()" />
        <select id="backlog-status" onchange="filterBacklog()">
          <option value="">All statuses</option>
          ${["Pending","InProgress","Completed","Failed","Blocked","Closed"].map(s => `<option>${s}</option>`).join("")}
        </select>
      </div>
      <table>

        <tbody id="backlog-tbody"></tbody>

    </section>
  `;

}

function filterBacklog() {
  const q = ($("backlog-filter")?.value || "").toLowerCase();
  const st = $("backlog-status")?.value || "";
  const rows = state.tasks.filter(t =>
    (!q || (t.id + " " + t.type + " " + t.title).toLowerCase().includes(q)) &&
    (!st || t.status === st)
  );
  $("backlog-tbody").innerHTML = rows.length === 0
    ? `<tr><td colspan="8" class="empty">No matches.</td></tr>`
    : rows.map(t => {
        const updated = t.updatedAt ? new Date(t.updatedAt).toLocaleTimeString() : "";
        return `<tr>
          <td class="id" onclick="showIssue('${t.id}')">${t.id}</td>
          <td>${t.type}</td>
          <td><span class="status ${t.status.toLowerCase()}">${t.status}</span></td>
          <td>${t.priority}</td>
          <td>${t.assignee || ""}</td>
          <td>${escapeHtml(t.title)}</td>
          <td>${t.parameters && t.parameters.sprintId ? t.parameters.sprintId : "—"}</td>
          <td>${updated}</td>
        </tr>`;
      }).join("");
}

// --- Intake tab ---

let intakeSessions = [];
let activeIntakeSessionId = null;
let activeIntakeTab = "spec";   // "spec" | "graph" | "deps"
let intakePanelCache = {};       // sessionId -> {specs[], diagrams{}[], touches{}[], deps{}[]}
let codebaseGraph = null;         // last-built graph for the project

async function renderIntake() {
  try {
    const r = await fetch("/api/intake/sessions");
    if (r.status === 404) { intakeSessions = []; }
    else if (!r.ok) throw new Error("HTTP " + r.status);
    else intakeSessions = await r.json();
  } catch (e) {
    intakeSessions = [];
  }
  // Auto-select the most recent session if none active.
  if (!activeIntakeSessionId && intakeSessions.length > 0) {
    activeIntakeSessionId = intakeSessions[0].id;
  }
  const left = `
    <div class="intake-sidebar">
      <div class="actions">
        <button onclick="openNewIntakeSession()">+ New intake</button>
      </div>
      ${intakeSessions.length === 0
        ? '<div class="empty">No intake sessions yet.</div>'
        : '<ul class="intake-session-list">' + intakeSessions.map(s => `
            <li class="${s.id === activeIntakeSessionId ? 'active' : ''}" onclick="selectIntakeSession('${s.id}')">
              <div class="title">${escapeHtml(s.title)}</div>
              <div class="meta">${s.projectId} · ${new Date(s.updatedAt).toLocaleString()}</div>
            </li>
          `).join("") + '</ul>'}
    </div>`;
  let right = '<div class="intake-thread"><div class="empty">Select or create an intake session.</div></div>';
  let panel = '<div class="intake-panel"><div class="empty">Select an intake session to see its spec.</div></div>';
  if (activeIntakeSessionId) {
    const session = intakeSessions.find(s => s.id === activeIntakeSessionId);
    if (session) {
      right = renderIntakeThread(session);
      panel = renderIntakePanel(session);
    }
  }
  $("tab-intake").innerHTML = `<div class="intake-grid-3">${left}${right}${panel}</div>`;
  // Render any Mermaid blocks that just landed in the DOM.
  setTimeout(rerenderMermaid, 0);
}

function renderIntakeThread(session) {
  const msgHtml = session.messages.map(m => {
    const epicLink = m.proposedEpicId
      ? `<div class="epic-proposal">
           <code>${escapeHtml(m.proposedEpicId)}</code>: ${escapeHtml(m.proposedEpicTitle || m.proposedEpicId)}
           <button class="secondary" onclick="acceptEpic('${session.id}', ${m.id})">Accept</button>
         </div>`
      : "";
    return `<div class="intake-msg role-${m.role.toLowerCase()}">
      <div class="role">${m.role}</div>
      <div class="content">${escapeHtml(m.content)}</div>
      ${epicLink}
    </div>`;
  }).join("");
  return `
    <div class="intake-thread">
      <div class="intake-messages" id="intake-messages">${msgHtml || '<div class="empty">No messages yet — say hi below.</div>'}</div>
      <form class="intake-input" onsubmit="sendIntakeMessage(event)">
        <input id="intake-text" placeholder="Describe what you want to build..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>`;
}

async function selectIntakeSession(id) {
  activeIntakeSessionId = id;
  await renderIntake();
}

async function openNewIntakeSession() {
  const projectId = prompt("Project id (e.g. 'PortHorizon'):");
  if (!projectId) return;
  const title = prompt("Title (optional):") || null;
  const r = await fetch("/api/intake/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ projectId, title }),
  });
  if (!r.ok) { alert(await r.text()); return; }
  const session = await r.json();
  activeIntakeSessionId = session.id;
  await renderIntake();
}

async function sendIntakeMessage(ev) {
  ev.preventDefault();
  const text = $("intake-text").value.trim();
  if (!text || !activeIntakeSessionId) return;
  $("intake-text").value = "";
  $("intake-text").disabled = true;
  try {
    const r = await fetch(`/api/intake/sessions/${activeIntakeSessionId}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      alert("Send failed: " + (await r.text()));
      return;
    }
    // Refresh from /api/intake/sessions to get the new messages.
    await renderIntake();
  } finally {
    $("intake-text").disabled = false;
    $("intake-text").focus();
  }
}

async function acceptEpic(sessionId, messageId) {
  const r = await fetch(`/api/intake/sessions/${sessionId}/accept-epic/${messageId}`, {
    method: "POST",
  });
  if (!r.ok) { alert("Accept failed: " + (await r.text())); return; }
  await renderIntake();
  await refreshState();
}

// --- Intake side-panel (Phase 2b.3) ---

async function renderIntakePanel(session) {
  // Lazily fetch the specs for this session + their extracted tables.
  const cached = intakePanelCache[session.id];
  if (!cached || cached.specs.length === 0) {
    await refreshIntakePanelCache(session.id);
  }
  const data = intakePanelCache[session.id] || { specs: [], diagrams: {}, touches: {}, deps: {} };

  const tabs = `
    <div class="intake-panel-tabs">
      <button class="${activeIntakeTab === 'spec' ? 'active' : ''}" onclick="setIntakeTab('spec', '${session.id}')">Spec</button>
      <button class="${activeIntakeTab === 'graph' ? 'active' : ''}" onclick="setIntakeTab('graph', '${session.id}')">Graph</button>
      <button class="${activeIntakeTab === 'deps' ? 'active' : ''}" onclick="setIntakeTab('deps', '${session.id}')">Deps</button>
    </div>`;

  const body = activeIntakeTab === 'spec' ? renderSpecTab(session, data)
              : activeIntakeTab === 'graph' ? renderGraphTab(session, data)
              : renderDepsTab(session, data);

  return `<div class="intake-panel">${tabs}<div class="intake-panel-body">${body}</div></div>`;
}

function setIntakeTab(tab, sessionId) {
  activeIntakeTab = tab;
  if (sessionId) renderIntake();
}

async function refreshIntakePanelCache(sessionId) {
  const specsResp = await fetch(`/api/intake/sessions/${sessionId}/specs`);
  if (!specsResp.ok) {
    intakePanelCache[sessionId] = { specs: [], diagrams: {}, touches: {}, deps: {} };
    return;
  }
  const specs = await specsResp.json();
  const diagrams = {};
  const touches = {};
  const deps = {};
  for (const s of specs) {
    const [d, t, dp] = await Promise.all([
      fetch(`/api/specs/${s.id}/diagrams`).then(r => r.ok ? r.json() : []),
      fetch(`/api/specs/${s.id}/touches`).then(r => r.ok ? r.json() : []),
      fetch(`/api/specs/${s.id}/deps`).then(r => r.ok ? r.json() : []),
    ]);
    diagrams[s.id] = d;
    touches[s.id] = t;
    deps[s.id] = dp;
  }
  intakePanelCache[sessionId] = { specs, diagrams, touches, deps };
}

function renderSpecTab(session, data) {
  if (!data.specs.length) {
    return '<div class="empty">No specs yet. The agent will produce them as the conversation progresses.</div>';
  }
  // Render each spec with its body + extracted diagrams.
  const blocks = data.specs.map(s => {
    const d = data.diagrams[s.id] || [];
    const diagramsHtml = d.length
      ? `<div class="spec-diagrams">${d.map(di => `<pre class="mermaid">${escapeHtml(di.source)}</pre>`).join("")}</div>`
      : '<div class="empty">No diagrams.</div>';
    return `
      <div class="spec-card">
        <div class="spec-head">
          <h4>${escapeHtml(s.title)}
            <span class="status-tag status-${s.status.toLowerCase()}">${s.status}</span>
            <span class="version-tag">v${s.currentVersion}</span>
          </h4>
        </div>
        <pre class="spec-body">${escapeHtml(s.body)}</pre>
        <h5>Diagrams (${d.length})</h5>
        ${diagramsHtml}
      </div>`;
  }).join("");
  return blocks;
}

function renderGraphTab(session, data) {
  // The Graph tab shows: the codebase import graph (rendered via
  // mermaid) + the spec_touches overlay.
  const touchesAll = data.specs.flatMap(s => (data.touches[s.id] || []).map(t => ({ ...t, spec: s.title })));
  const buttonRow = `
    <div class="graph-toolbar">
      <input id="graph-repo" placeholder="repoRoot (e.g. C:\\path\\to\\repo)" size="40" />
      <button onclick="buildCodebaseGraph()">Build / refresh</button>
    </div>`;

  if (!codebaseGraph) {
    return buttonRow + '<div class="empty">No codebase graph built yet. Click Build / refresh above.</div>';
  }

  // Build a small mermaid flowchart of the codebase. Mermaid's
  // syntax limits node-id characters to alphanumerics + underscore;
  // we sanitize paths to filenames.
  const lines = ["flowchart LR"];
  for (const f of codebaseGraph.files.slice(0, 80)) {
    const id = sanitizeMermaidId("file_" + f.path);
    lines.push(`  ${id}["${escapeHtml(f.path)}"]`);
  }
  for (const e of codebaseGraph.imports.slice(0, 120)) {
    const a = sanitizeMermaidId("file_" + e.from);
    const b = sanitizeMermaidId("ns_" + e.to);
    lines.push(`  ${a} --> ${b}["${escapeHtml(e.to)}"]`);
  }
  const mermaidSrc = lines.join("\n");

  // Spec touches overlay: highlight each module touched.
  const touchesHtml = touchesAll.length
    ? `<div class="touches-list"><h5>Spec touches (${touchesAll.length})</h5>
        <ul>${touchesAll.map(t => `<li><code>${escapeHtml(t.moduleId)}</code> (from <i>${escapeHtml(t.spec)}</i>)${t.rationale ? ' — ' + escapeHtml(t.rationale) : ''}</li>`).join("")}</ul></div>`
    : '';

  return buttonRow + `
    <div class="graph-meta">
      Repo: <code>${escapeHtml(codebaseGraph.repoRoot)}</code> ·
      sha: <code>${codebaseGraph.repoSha.slice(0, 8)}</code> ·
      built: ${new Date(codebaseGraph.builtAt).toLocaleString()} ·
      files: ${codebaseGraph.fileCount} ·
      imports: ${codebaseGraph.importCount} ·
      projects: ${codebaseGraph.projectEdgeCount}
    </div>
    <pre class="mermaid">${escapeHtml(mermaidSrc)}</pre>
    ${touchesHtml}
    <p class="empty">Graph renders the first 80 files / 120 imports for performance. The full graph lives at <code>.portHorizon/codebase-graph/${codebaseGraph.repoSha.slice(0, 8)}.json</code>.</p>
  `;
}

function renderDepsTab(session, data) {
  const all = data.specs.flatMap(s =>
    (data.deps[s.id] || []).map(d => ({ ...d, fromTitle: s.title })));
  if (!all.length) {
    return '<div class="empty">No declared dependencies yet.</div>';
  }
  // Group by direction.
  const outgoing = all.filter(d => d.fromSpecId);
  const incoming = all.filter(d => !d.fromSpecId);
  const render = (d) => `
    <li>
      <code>${escapeHtml(d.fromSpecId)}</code>
      <span class="kind-tag kind-${d.kind}">${d.kind}</span>
      <code>${escapeHtml(d.toSpecId)}</code>
      ${d.rationale ? '<span class="dep-rationale">— ' + escapeHtml(d.rationale) + '</span>' : ''}
    </li>`;
  return `
    <div class="deps-list">
      <h5>Declared edges (${all.length})</h5>
      <ul class="deps-ul">${all.map(render).join("")}</ul>
    </div>
  `;
}

async function buildCodebaseGraph() {
  const repoRoot = $("graph-repo").value.trim();
  if (!repoRoot) {
    alert("Enter a repoRoot path");
    return;
  }
  const r = await fetch(`/api/codebase-graph?repoRoot=${encodeURIComponent(repoRoot)}`);
  if (!r.ok) {
    alert("Build failed: " + (await r.text()));
    return;
  }
  codebaseGraph = await r.json();
  // Re-render whichever tab is active so the new graph appears.
  if (activeIntakeSessionId) renderIntake();
  // Mermaid rendering happens via mermaid.run() on next idle tick.
  if (typeof mermaid !== "undefined") mermaid.run();
}

function sanitizeMermaidId(s) {
  // Mermaid node ids: alphanumerics + underscore. Replace others.
  return s.replace(/[^A-Za-z0-9_]/g, "_");
}

// Render any .mermaid pre blocks that just landed in the DOM.
function rerenderMermaid() {
  if (typeof mermaid === "undefined") return;
  const blocks = document.querySelectorAll("pre.mermaid:not([data-rendered])");
  blocks.forEach(async (el) => {
    try {
      const id = "mermaid-" + Math.random().toString(36).slice(2, 8);
      const svg = await mermaid.render(id, el.textContent);
      el.innerHTML = svg.svg;
      el.setAttribute("data-rendered", "1");
    } catch (ex) {
      el.innerHTML = "<pre class=\"mermaid-error\">" + escapeHtml(String(ex)) + "</pre>";
    }
  });
}

async function renderVision() {

async function renderDesign() {
  const tab = $("tab-design");
  tab.innerHTML = `<div class="empty">Loading…</div>`;
  // List specs in design-related states. The dashboard groups them
  // so the operator can see the design pipeline at a glance.
  let specs;
  try {
    const r = await fetch("/api/specs");
    if (!r.ok) {
      tab.innerHTML = `<div class="empty">Failed to load specs (HTTP ${r.status}).</div>`;
      return;
    }
    const all = await r.json();
    specs = all.filter(s =>
      s.status === "Designed" || s.status === "ReadyForDesign" ||
      s.status === "NeedsRevision" || s.status === "Approved" ||
      s.status === "Grooming" || s.status === "Groomed"
    );
  } catch (e) {
    tab.innerHTML = `<div class="empty">Failed to load: ${escapeHtml(String(e))}</div>`;
    return;
  }
  if (specs.length === 0) {
    tab.innerHTML = `<div class="empty">No specs in the design pipeline. Trigger a design run from the Specs tab.</div>`;
    return;
  }

  // Group by status so the operator can scan state at a glance.
  const order = ["ReadyForDesign", "NeedsRevision", "Designed", "Approved", "Grooming", "Groomed"];
  const groups = {};
  for (const s of specs) (groups[s.status] ??= []).push(s);
  const sortedKeys = order.filter(k => groups[k]);
  for (const k of Object.keys(groups)) if (!sortedKeys.includes(k)) sortedKeys.push(k);

  const sections = sortedKeys.map(k => {
    const rows = groups[k].map(s => `
      <tr>
        <td><a href="#specs" onclick="renderSpecDetail('${s.id}');return false;">${escapeHtml(s.id)}</a></td>
        <td>${escapeHtml(s.title)}</td>
        <td><button onclick="loadDesignArtifacts('${s.id}');return false;">View artifacts</button></td>
      </tr>`).join("");
    return `<h3>${k} (${groups[k].length})</h3>
      <table>
        <tr><th>id</th><th>title</th><th></th></tr>
        ${rows}
      </table>`;
  }).join("");

  tab.innerHTML = `<div class="design-grid">${sections}</div>
    <div id="design-artifacts"></div>`;
}

async function loadDesignArtifacts(specId) {
  const out = $("design-artifacts");
  out.innerHTML = `<div class="empty">Loading ${escapeHtml(specId)}…</div>`;
  let arts, runs;
  try {
    [arts, runs] = await Promise.all([
      fetch(`/api/specs/${specId}/design-artifacts`).then(r => r.json()),
      fetch(`/api/designer/runs?specId=${specId}`).then(r => r.json()),
    ]);
  } catch (e) {
    out.innerHTML = `<div class="empty">Failed: ${escapeHtml(String(e))}</div>`;
    return;
  }

  const artRows = arts.map(a => {
    let body = "";
    if (a.bodyKind === "html") {
      // Iframe with the rendered HTML so a malicious body can't
      // execute scripts. Same-origin operator can read it.
      body = `<iframe sandbox srcdoc="${escapeHtml(a.body)}" style="width:100%;height:200px;border:1px solid var(--border)"></iframe>`;
    } else if (a.bodyKind === "svg") {
      body = `<div class="svg-frame">${a.body}</div>`;
    } else {
      body = `<pre class="vision-content">${escapeHtml(a.body)}</pre>`;
    }
    return `<div class="design-artifact">
      <div class="design-artifact-head">
        <span class="status-tag status-${a.status}">${a.status}</span>
        <strong>${escapeHtml(a.title)}</strong>
        <span class="muted">${escapeHtml(a.kind)} · ${a.author}</span>
      </div>
      ${body}
    </div>`;
  }).join("") || `<div class="empty">No design artifacts yet.</div>`;

  const runRows = runs.map(r => {
    const findings = r.hygieneReport ? (() => {
      try {
        const j = JSON.parse(r.hygieneReport);
        if (j.findings?.length) return `<div class="hygiene-findings">${j.findings.map(f =>
          `<div class="hygiene-finding"><strong>${escapeHtml(f.rule)}</strong> [${escapeHtml(f.severity)}] — ${escapeHtml(f.message)}</div>`
        ).join("")}</div>`;
        return `<div class="empty">Hygiene: passed (no findings)</div>`;
      } catch { return ""; }
    })() : "";
    return `<div class="design-run">
      <div><span class="status-tag status-${r.status}">${r.status}</span>
        <span class="muted">${r.trigger} · ${new Date(r.ts).toLocaleString()} · ${r.durationMs}ms</span>
      </div>
      ${r.error ? `<div class="design-error">${escapeHtml(r.error)}</div>` : ""}
      ${findings}
    </div>`;
  }).join("") || `<div class="empty">No designer runs.</div>`;

  out.innerHTML = `
    <h2>${escapeHtml(specId)} — design artifacts</h2>
    <div>${artRows}</div>
    <h2>designer runs</h2>
    <div>${runRows}</div>`;
}

function filterSpecs() {
  // The dashboard's lightweight implementation: just re-render. The
  // list is bounded (low hundreds of specs typical), so a client-side
  // filter isn't worth the complexity yet.
  renderSpecs();
}

async function selectSpec(id) {
  activeSpecId = id;
  await renderSpecs();
}

async function renderSpecDetail(spec) {
  let versions = [];
  try {
    const r = await fetch(`/api/specs/${spec.id}/versions`);
    if (r.ok) versions = await r.json();
  } catch (e) { versions = []; }
  const versionLinks = versions.map(v => `
    <div class="spec-version">
      <div class="version-head">
        v${v.version} · ${new Date(v.createdAt).toLocaleString()}${v.author ? ' · ' + escapeHtml(v.author) : ''}
        ${v.version === spec.currentVersion ? '<span class="tag active">current</span>' : ''}
      </div>
      <pre class="version-body">${escapeHtml(v.body)}</pre>
    </div>
  `).join("");
  return `
    <div class="specs-detail">
      <div class="spec-head">
        <h2>${escapeHtml(spec.title)}
          <span class="status-tag status-${spec.status.toLowerCase()}">${spec.status}</span>
        </h2>
        <div class="spec-meta">
          project: <code>${escapeHtml(spec.projectId)}</code> ·
          current version: <code>v${spec.currentVersion}</code> ·
          ${versions.length} version${versions.length === 1 ? '' : 's'}
          ${spec.parentIssueId ? ' · parent issue: <code>' + escapeHtml(spec.parentIssueId) + '</code>' : ''}
          ${spec.author ? ' · author: ' + escapeHtml(spec.author) : ''}
        </div>
        ${spec.status === 'Approved' ? `
          <div class="spec-actions">
            <button id="btn-groom" class="primary" onclick="startGrooming('${spec.id}')">Start grooming</button>
            <span id="groom-status" class="muted"></span>
          </div>
        ` : ''}
      </div>
      <h3>Body</h3>
      <pre class="spec-body">${escapeHtml(spec.body)}</pre>
      <h3>Version history</h3>
      ${versionLinks || '<div class="empty">No versions.</div>'}
    </div>`;
}

async function startGrooming(specId) {
  const status = $("groom-status");
  const btn = $("btn-groom");
  if (!btn || !status) return;
  btn.disabled = true;
  status.textContent = "Starting…";
  try {
    const r = await fetch(`/api/specs/${specId}/groom`, { method: "POST" });
    if (r.status === 202) {
      status.textContent = "Agent running. Watch the live event log.";
    } else if (r.status === 400) {
      const j = await r.json().catch(() => ({}));
      status.textContent = `Cannot groom: ${j.error || "spec not approved"}`;
      btn.disabled = false;
    } else if (r.status === 404) {
      status.textContent = "Spec not found.";
      btn.disabled = false;
    } else {
      status.textContent = `Unexpected response ${r.status}`;
      btn.disabled = false;
    }
  } catch (e) {
    status.textContent = `Error: ${e}`;
    btn.disabled = false;
  }
}

async function refreshMessageCount(kiloName) {
  try {
    const r = await fetch(`/api/agents/${kiloName}/messages`);
    if (!r.ok) return;
    const j = await r.json();
    const el = $(`msg-count-${kiloName}`);
    if (el) el.textContent = j.pending;
  } catch (e) {}
}

document.querySelectorAll("#tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    const id = "tab-" + btn.dataset.tab;
    document.getElementById(id).classList.add("active");
    if (btn.dataset.tab === "vision") renderVision();
    if (btn.dataset.tab === "design") renderDesign();
  });
});
$("modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

(function connectEvents() {
  if (!window.EventSource) return;
  const es = new EventSource("/api/events");
  es.onopen = () => { $("conn").className = "pill live"; $("conn").textContent = "● live"; };
  es.onerror = () => { $("conn").className = "pill"; $("conn").textContent = "✕ reconnecting"; };
  es.onmessage = (e) => {
    try {
      const ev = JSON.parse(e.data);
      addEvent(ev);
      // Phase 2b.3: when an intake run completes, refresh the
      // side-panel cache for the active session so new specs +
      // extracted diagrams/touches/deps show up live.
      if (ev.kind === "intake.run.completed" && activeIntakeSessionId) {
        intakePanelCache[activeIntakeSessionId] = null;
        renderIntake();
      }
    } catch {}
  };
})();

function addEvent(ev) {
  const box = $("events");
  if (!box) return;
  const el = document.createElement("div");
  el.className = "ev " + (ev.kind || "").replace(/[.\/]/g, "-");
  el.innerHTML = `<span class="t">${new Date(ev.timestamp).toLocaleTimeString()}</span><span class="k">${escapeHtml(ev.kind)}</span><span class="d">${escapeHtml(ev.detail || "")}</span>`;
  box.appendChild(el);
  while (box.children.length > 200) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

loadState();
setInterval(() => {
  state.agents.forEach(a => refreshMessageCount(a.kiloName));
}, 10000);

// Global error trap so failed renders show in the UI
window.addEventListener("error", (e) => {
  const tasks = $("tab-tasks");
  if (tasks && tasks.textContent.includes("Loading")) {
    tasks.innerHTML = `<div class="empty">JS error: ${escapeHtml(String(e.error || e.message))}</div>`;
  }
  console.error("dashboard global error", e.error || e.message);
});
